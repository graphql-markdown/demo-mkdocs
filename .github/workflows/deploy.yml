name: Deploy to GitHub Pages

run-name: "Deploy to GitHub Pages by @${{ github.actor }}"

on:
  workflow_dispatch:
  push:
    branches: [main]

# One deploy at a time: a newer merge waits for the running deploy instead of
# racing it on the gh-pages branch (only the latest pending run is kept).
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          npm ci
          pip install mkdocs

      - name: Generate GraphQL docs
        run: npm run generate
        env:
          GRAPHQL_MARKDOWN_TELEMETRY_DEBUG: "1"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Build, then add each page's Markdown copy at `<page-url>.md`:
      # `mkdocs gh-deploy` would build and push without the copies.
      - name: Build
        run: |
          mkdocs build
          node -e "require('node:fs').cpSync('.markdown-copies','site',{recursive:true})"

      # What `mkdocs gh-deploy` does after building (ghp-import ships with MkDocs)
      - name: Deploy
        run: ghp-import --no-jekyll --push --force site
